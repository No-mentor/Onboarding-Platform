name: 🐛 Bug Report
description: 예상과 다른 동작, 오류, 권한/보안 이슈를 제보합니다.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        제보 전에 `AI_LEARN_FIRST.pdf` 원칙(특히 **Permission / Citation / workspace isolation**)과 관련 명세를 확인해 주세요.

  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      description: 보안(권한 누수)은 항상 Critical로 분류합니다.
      options:
        - Critical (보안·데이터 유출·서비스 불가)
        - High (핵심 플로우 차단)
        - Medium (우회 가능)
        - Low (사소한 UI/카피)
      default: 1
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - Auth / Membership
        - Workspace
        - Documents / Ingest / RAG
        - Onboarding Plan
        - Recommendations (오늘 할 일)
        - Checklist / Progress
        - Chat (Citation / Permission)
        - Admin Dashboard
        - Frontend UI
        - Infra / Docker / CI
        - Docs
        - Other
      default: 11
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 한두 문장으로 문제를 설명하세요.
      placeholder: 예) NEW_HIRE가 RESTRICTED 문서 내용을 Chat에서 조회할 수 있음
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      description: 가능한 한 단계별로 적어 주세요.
      placeholder: |
        1. Admin으로 Workspace 생성
        2. …
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      placeholder: 명세/AC 기준으로 무엇이 나와야 하나요?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      placeholder: 무엇이 발생했나요? 에러 메시지, HTTP status, 스크린샷 등
    validations:
      required: true

  - type: input
    id: feature_id
    attributes:
      label: 관련 Feature ID (있으면)
      placeholder: 예) F-03
    validations:
      required: false

  - type: input
    id: env
    attributes:
      label: 환경
      placeholder: local / docker-compose / staging · OS · 브라우저 · 커밋 SHA
    validations:
      required: false

  - type: checkboxes
    id: invariants
    attributes:
      label: 보안 불변식 관련 여부
      options:
        - label: workspace isolation 위반 의심 (INV-02)
        - label: Permission Check 누락 의심 (INV-03)
        - label: Citation 누락 의심 (INV-04)
        - label: Audit Log 누락 의심 (INV-07)

  - type: textarea
    id: extra
    attributes:
      label: 추가 정보
      placeholder: 로그, traceId, 관련 PR, 스크린샷 링크 등
