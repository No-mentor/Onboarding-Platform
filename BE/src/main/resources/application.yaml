spring:
  application:
    name: onboarding

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:onboarding}
    username: ${DB_USERNAME:onboarding}
    password: ${DB_PASSWORD:onboarding}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:onboardos-dev-secret-change-me-min-32-chars!!}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  mail:
    # 필수 기능: 항상 발송 시도. MAIL_USERNAME/PASSWORD 미설정 시에는 발송 실패 로그만 남고 초대 자체는 실패하지 않음
    from: ${MAIL_FROM:no-reply@onboardos.com}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    root: ${STORAGE_ROOT:./storage}
    supabase-url: ${SUPABASE_URL:}
    supabase-secret-key: ${SUPABASE_SECRET_KEY:}
    supabase-bucket: ${SUPABASE_STORAGE_BUCKET:onboardos-documents}
    cleanup:
      enabled: ${DOCUMENT_STORAGE_CLEANUP_ENABLED:true}
      retention-days: ${DOCUMENT_STORAGE_RETENTION_DAYS:7}
      batch-size: ${DOCUMENT_STORAGE_CLEANUP_BATCH_SIZE:100}
      cron: ${DOCUMENT_STORAGE_CLEANUP_CRON:0 0 3 * * *}
      zone: ${DOCUMENT_STORAGE_CLEANUP_ZONE:UTC}
  ai:
    # true 이고 OPENAI_API_KEY 가 있으면 임베딩·LLM 사용, 아니면 키워드 RAG fallback
    enabled: ${AI_ENABLED:false}
    openai-api-key: ${OPENAI_API_KEY:}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
    chat-model: ${AI_CHAT_MODEL:gpt-4o-mini}
    embedding-dimension: 1536
    embedding-timeout-ms: ${AI_EMBEDDING_TIMEOUT_MS:10000}


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
    com.onboardos: DEBUG
