spring:
  datasource:
    url: jdbc:h2:mem:onboardos;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    # H2 may not support all PG checks — use test-specific migration path if needed

app:
  jwt:
    secret: test-secret-key-that-is-long-enough-123456
    expiration-ms: 3600000
