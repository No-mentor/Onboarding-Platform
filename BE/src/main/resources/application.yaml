spring:
  application:
    name: onboarding

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:onboarding}
    username: ${DB_USERNAME:onboarding}
    password: ${DB_PASSWORD:onboarding}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:onboardos-dev-secret-change-me-min-32-chars!!}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    root: ${STORAGE_ROOT:./storage}
    supabase-url: ${SUPABASE_URL:}
    supabase-secret-key: ${SUPABASE_SECRET_KEY:}
    supabase-bucket: ${SUPABASE_STORAGE_BUCKET:onboardos-documents}
  ai:
    # true 이고 OPENAI_API_KEY 가 있으면 임베딩·LLM 사용, 아니면 키워드 RAG fallback
    enabled: ${AI_ENABLED:false}
    openai-api-key: ${OPENAI_API_KEY:}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
    chat-model: ${AI_CHAT_MODEL:gpt-4o-mini}
    embedding-dimension: 1536


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
    com.onboardos: DEBUG
