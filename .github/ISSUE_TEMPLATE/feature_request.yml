name: ✨ Feature / Enhancement
description: 새 기능 또는 개선 제안을 등록합니다. TTP 게이트를 통과해야 합니다.
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **게이트 질문:** 이 기능이 신입의 Time To Productivity(TTP)를 실제로 높이는가?  
        단순 RAG 챗봇 · LMS · 문서 검색 형태는 Out of Scope입니다. (`AI_LEARN_FIRST.pdf` 참고)

  - type: dropdown
    id: priority
    attributes:
      label: 제안 우선순위
      options:
        - P0 (MVP 필수)
        - P1 (MVP Partial / 직후)
        - P2 (Post-MVP)
        - Unsure
      default: 3
    validations:
      required: true

  - type: dropdown
    id: mvp
    attributes:
      label: MVP 포함 여부 (현재 계획 기준)
      options:
        - Yes
        - Partial
        - No (Post-MVP)
        - Unsure
      default: 3
    validations:
      required: true

  - type: input
    id: feature_id
    attributes:
      label: 관련 Feature ID
      description: 기능명세서 F-xx. 신규면 비워 두세요.
      placeholder: 예) F-02
    validations:
      required: false

  - type: dropdown
    id: persona
    attributes:
      label: 주요 사용자
      options:
        - NEW_HIRE (신입)
        - ADMIN / HR
        - MANAGER
        - IT / Security
        - ALL
      default: 0
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 누구의 어떤 Pain인가요? (기능 나열보다 문제 중심)
      placeholder: 예) 신입이 대시보드 진입 시 오늘 할 일이 비어 있어 질문부터 하게 됨
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 동작 요약, 화면/API 스케치
    validations:
      required: true

  - type: textarea
    id: ttp
    attributes:
      label: TTP 영향 (게이트)
      description: 이 기능이 TTP를 어떻게 줄이는지 한 단락으로 설명하세요. 설명 불가면 구현 후보에서 제외됩니다.
      placeholder: 예) 첫 업무 전 필수 문서/사람/체크리스트를 선제 제시해 탐색 시간을 줄임
    validations:
      required: true

  - type: checkboxes
    id: scope_check
    attributes:
      label: Out of Scope 자가 점검
      options:
        - label: 단순 RAG 챗봇이 아니다
          required: true
        - label: LMS / 교육 플랫폼이 아니다
          required: true
        - label: 일반 문서 검색 서비스가 아니다
          required: true

  - type: textarea
    id: ac
    attributes:
      label: 수용 기준 (Acceptance Criteria) 초안
      value: |
        - [ ] Given … When … Then …
        - [ ] 권한/Workspace 격리 확인
        - [ ] (AI인 경우) Citation + Permission Check
    validations:
      required: true

  - type: textarea
    id: api_erd
    attributes:
      label: API / ERD 영향
      placeholder: 신규 엔드포인트, 테이블/컬럼 변경이 있으면 명시 (docs/ API·ERD 참고)
