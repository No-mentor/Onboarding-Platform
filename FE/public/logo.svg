<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-labelledby="title desc">
  <title id="title">사수없음 · OnboardOS</title>
  <desc id="desc">팀 사수없음(No Mentor) 온보딩 플랫폼 로고. 스스로 길을 찾는 경로와 AI 가이드를 상징합니다.</desc>
  <defs>
    <linearGradient id="g-path" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B3A5F"/>
      <stop offset="55%" stop-color="#2E75B6"/>
      <stop offset="100%" stop-color="#4DA3FF"/>
    </linearGradient>
    <linearGradient id="g-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EB1FF"/>
      <stop offset="100%" stop-color="#2E75B6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1B3A5F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Icon mark: self-guided path (no mentor) + rising onboarding steps -->
  <g filter="url(#soft)" transform="translate(8,12)">
    <!-- Soft plate -->
    <rect x="0" y="0" width="96" height="96" rx="24" fill="#F0F6FC"/>
    <rect x="0" y="0" width="96" height="96" rx="24" fill="none" stroke="#D0E3F5" stroke-width="1.5"/>

    <!-- Path curve: independent journey -->
    <path
      d="M22 72 C28 72 30 58 40 52 C50 46 52 40 58 34 C64 28 70 24 78 22"
      fill="none"
      stroke="url(#g-path)"
      stroke-width="5.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Step nodes along the path -->
    <circle cx="28" cy="70" r="5" fill="#1B3A5F"/>
    <circle cx="46" cy="48" r="5" fill="#2E75B6"/>
    <circle cx="62" cy="32" r="5" fill="#3D8FD4"/>

    <!-- Destination node (productivity) -->
    <circle cx="78" cy="22" r="8" fill="url(#g-spark)"/>
    <circle cx="78" cy="22" r="3.2" fill="#FFFFFF"/>

    <!-- Small AI spark near goal (proactive guide, not a human mentor) -->
    <path d="M84 10 L85.2 13.2 L88.5 14.2 L85.2 15.2 L84 18.4 L82.8 15.2 L79.5 14.2 L82.8 13.2 Z" fill="#2E75B6"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(124, 28)">
    <!-- Team name -->
    <text
      x="0" y="34"
      font-family="Apple SD Gothic Neo, AppleGothic, Malgun Gothic, Noto Sans KR, sans-serif"
      font-size="36"
      font-weight="700"
      fill="#1B3A5F"
      letter-spacing="-0.5"
    >사수없음</text>

    <!-- English / product line -->
    <text
      x="0" y="62"
      font-family="Inter, SF Pro Text, Helvetica Neue, Arial, sans-serif"
      font-size="15"
      font-weight="600"
      fill="#2E75B6"
      letter-spacing="1.6"
    >NO MENTOR</text>

    <!-- Product tag -->
    <text
      x="108" y="62"
      font-family="Inter, SF Pro Text, Helvetica Neue, Arial, sans-serif"
      font-size="15"
      font-weight="500"
      fill="#6B7C8F"
      letter-spacing="0.4"
    >·  온보딩  OnboardOS</text>
  </g>
</svg>
